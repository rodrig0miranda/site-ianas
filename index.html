<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'anas Flow Beach | Oficial</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --marrom-escuro: #1A110B;
            --verde-logo: #1B5E20;
            --dourado: #C49A45;
            --areia: #F4EFE6;
            --marrom: #3D2B1F;
            --pistache: #849C72;
            --branco: #FFFFFF;
        }

        body, html { 
            height: 100%; 
            font-family: 'Montserrat', sans-serif; 
            background-color: #F4EFE6;
        }

        .hero-section {
            min-height: 100vh;
            background-image: url('fundo.jpeg');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(244, 239, 230, 0.80); 
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--marrom-escuro);
            margin-bottom: 10px;
            font-weight: 300;
        }

        .subtitle span { 
            display: block; 
            margin-top: 8px; 
            font-weight: 400;
        }

        .logo { 
            width: 300px; 
            margin-bottom: 10px; 
        }

        .tagline {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.8;
            color: var(--marrom-escuro);
            margin-bottom: 25px;
            border-top: 1px solid rgba(26, 17, 11, 0.2);
            border-bottom: 1px solid rgba(26, 17, 11, 0.2);
            padding: 15px 0;
            width: 80%;
        }

        .signature {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2rem;
            color: var(--verde-logo);
            margin-bottom: 50px;
        }

        .cta-button {
            background: linear-gradient(90deg, #849C72, #1B5E20);
            color: #fff;
            padding: 18px 45px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            text-align: center;
        }

        .cta-button:hover {
            transform: scale(1.05);
        }
        
        .countdown {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .time-box {
            background: var(--areia);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,2);
            min-width: 70px;
        }

        .time-box span {
            display: block;
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--verde-logo);
            font-family: 'Playfair Display', serif;
        }

        .time-box label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--marrom);
            margin-top: 5px;
            display: block;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="hero-section">
        <div class="hero-overlay"></div>
        <div class="content">
            
            <div class="subtitle">
                É OFICIAL. <span>Apresentamos a nossa marca.</span>
            </div>
            <br>
            <img src="logo.png" alt="I'anas Flow Beach" class="logo">

            <div class="tagline">
                Moda praia para mulheres<br>que gostam de se sentir únicas.
            </div>

            <div class="signature">
                Mais que moda, é o seu momento.
            </div>
            
            <div class="countdown" id="countdown">
                <div class="time-box"><span id="days">00</span><label>Dias</label></div>
                <div class="time-box"><span id="hours">00</span><label>Horas</label></div>
                <div class="time-box"><span id="minutes">00</span><label>Min</label></div>
                <div class="time-box"><span id="seconds">00</span><label>Seg</label></div>
            </div>
            
            <a id="cta-btn" href="https://wa.me/5571991720048?text=Ol%C3%A1!%20Vim%20pelo%20site%20e%20quero%20receber%20o%20acesso%20VIP%20assim%20que%20a%20loja%20abrir!" class="cta-button" target="_blank">QUERO ACESSO ANTECIPADO</a>

            <script>
                const launchDate = new Date("Oct 3, 2026 18:00:00").getTime();

                const x = setInterval(function() {
                    const now = new Date().getTime();
                    const distance = launchDate - now;

                    if (distance <= 0) {
                        clearInterval(x);
                        document.getElementById("countdown").innerHTML = "<h2 style='font-family: Playfair Display; color: var(--pistache); font-size: 2.2rem; margin-bottom: 40px;'>A coleção está no ar!</h2>";
                        
                        const cta = document.getElementById("cta-btn");
                        cta.innerText = "VEJA A COLEÇÃO AGORA";
                        cta.href = "https://wa.me/5571991720048?text=Ol%C3%A1!%20Quero%20ver%20o%20cat%C3%A1logo%20da%20nova%20cole%C3%A7%C3%A3o!";
                        return;
                    }

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    document.getElementById("days").innerText = days < 10 ? "0" + days : days;
                    document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                    document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                    document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
                }, 1000);
            </script>

        </div>
    </div>

</body>
</html>
